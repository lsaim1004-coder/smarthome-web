# 관리자 화면 (iot-admin.kiwan.kr). 검색엔진에 뜨면 안 되고, 로그인 통로는 촘촘히 제한한다.
limit_req_zone $binary_remote_addr zone=adminauth:10m rate=12r/m;

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    absolute_redirect off;   # TLS 종단(Cloudflare·NPM) 뒤에 있어 Location 을 상대 경로로

    set_real_ip_from 192.168.0.0/24;
    set_real_ip_from 172.16.0.0/12;
    real_ip_header CF-Connecting-IP;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
    gzip_min_length 512;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;

    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api http://admin-api:8080;

    # 상태 조회·로그아웃은 화면마다 부르므로 제한 대상에서 뺀다
    location = /api/auth/me {
        proxy_pass $api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }
    location = /api/auth/logout {
        proxy_pass $api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    # 가입·인증·재발송·로그인: IP 당 분당 12회
    location /api/auth/ {
        limit_req zone=adminauth burst=12 nodelay;
        limit_req_status 429;
        client_max_body_size 16k;
        proxy_pass $api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 30s;
    }

    # 도면 업로드는 본문이 커서 따로 연다. 정규식 location 이 prefix 보다 먼저 매칭된다.
    location ~ ^/api/admin/inquiries/[0-9]+/floorplans$ {
        proxy_pass $api;
        proxy_http_version 1.1;
        client_max_body_size 24m;
        proxy_request_buffering off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    location /api/ {
        proxy_pass $api;
        proxy_http_version 1.1;
        client_max_body_size 1m;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 60s;
    }

    location ~* \.(js|css|svg|png|jpg|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # 로그인 확인용 내부 서브요청 (백엔드가 세션을 보고 204 / 401)
    location = /api/auth/check {
        internal;
        proxy_pass $api;
        proxy_http_version 1.1;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Host $host;
        proxy_set_header Cookie $http_cookie;
        proxy_set_header X-Original-URI $request_uri;
    }

    # 자료실: 로그인한 관리자만. 공개 사이트에서 이쪽으로 옮겨 왔다.
    location /docs/ {
        auth_request /api/auth/check;
        error_page 401 403 = @need_login;
        try_files $uri $uri/ =404;
    }
    location @need_login {
        return 302 /login?next=$request_uri;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
