spring:
  application:
    name: smarthome-backend
  # 같은 이미지를 두 서버로 띄운다.
  #  public : iot.kiwan.kr       — 로그인 없는 공개 사이트 + 접수
  #  admin  : iot-admin.kiwan.kr — 로그인해서 쓰는 관리자
  profiles:
    active: ${APP_ROLE:public}
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/smarthome}
    username: ${SPRING_DATASOURCE_USERNAME:smarthome}
    password: ${SPRING_DATASOURCE_PASSWORD:smarthome}
    hikari:
      maximum-pool-size: 5
      initialization-fail-timeout: 60000
  sql:
    init:
      mode: always
      continue-on-error: false
  session:
    jdbc:
      initialize-schema: always
    timeout: 7d
  jackson:
    time-zone: Asia/Seoul
  servlet:
    multipart:
      # 사진 1장 10MB · 도면 1장 20MB. nginx client_max_body_size 와 같이 움직여야 한다.
      max-file-size: 20MB
      max-request-size: 128MB

server:
  port: 8080
  shutdown: graceful
  forward-headers-strategy: framework
  servlet:
    session:
      cookie:
        name: SHSESSION
        http-only: true
        same-site: lax
        secure: false
        path: /

app:
  service-name: Smart Home Option Service
  welcome-message: "입주하는 날, 스마트홈이 완성되어 있습니다."
  base-url: ${APP_BASE_URL:http://localhost}
  # 상담 신청에 붙는 가전 사진 저장 위치. compose 에서 이름 있는 볼륨으로 마운트한다.
  upload-dir: ${APP_UPLOAD_DIR:/data/uploads}
  # 관리자 이메일(콤마 구분). 이 계정으로 로그인하면 /admin/inquiries 목록을 볼 수 있고 상담 접수 알림을 받는다.
  admin-emails: ${APP_ADMIN_EMAILS:}
  mail:
    # log  : 메일을 보내지 않고 백엔드 로그와 API 응답(devCode)에 인증번호 표시 (개발용)
    # smtp : 아래 SMTP 설정으로 실제 발송
    mode: ${APP_MAIL_MODE:log}
    host: ${APP_MAIL_HOST:}
    port: ${APP_MAIL_PORT:587}
    username: ${APP_MAIL_USERNAME:}
    password: ${APP_MAIL_PASSWORD:}
    from: ${APP_MAIL_FROM:no-reply@kiwan.kr}
    starttls: ${APP_MAIL_STARTTLS:true}
  verification:
    code-ttl-minutes: 10
    max-attempts: 5
    resend-cooldown-seconds: 60
  # 관리자 서버 주소. 접수 알림 메일의 링크에 쓴다.
  admin-url: ${APP_ADMIN_URL:https://iot-admin.kiwan.kr}
  # 가전 사진 자동판별. 키가 없으면 사진 판독은 건너뛰고 구매 시기·브랜드 규칙으로만 채운다.
  analysis:
    enabled: ${APP_ANALYSIS_ENABLED:true}
    api-key: ${APP_ANALYSIS_API_KEY:}
    model: ${APP_ANALYSIS_MODEL:claude-sonnet-5}
    base-url: ${APP_ANALYSIS_BASE_URL:https://api.anthropic.com}
    # 모델명을 읽어낸 뒤 사진 원본을 지운다. 남길 이유가 없고, 남기면 관리 대상이 된다.
    purge-after: ${APP_ANALYSIS_PURGE_AFTER:true}
    max-attempts: 3
    batch-size: 5
  # 도면 이미지 저장 위치. 관리자가 올리는 작업 자료라 고객 사진(upload-dir)과 나눠 둔다 —
  # 고객 사진은 판별 후 지우지만 도면은 시공이 끝날 때까지 남는다.
  floorplan-dir: ${APP_FLOORPLAN_DIR:/data/floorplans}
  # 비밀번호에 섞는 서버키(pepper). DB 가 아니라 이 파일에만 있어서, DB 만 새도 비밀번호를 맞춰 볼 수 없다.
  # 없으면 처음 뜰 때 만들고, 공개·관리자 두 컨테이너가 같은 볼륨(keys)을 본다.
  # 이 파일을 잃으면 기존 비밀번호는 모두 확인할 수 없다.
  security:
    key-file: ${APP_KEY_FILE:/data/keys/password.key}
  # 관리자 서버(LXC 112)가 공개 서버(LXC 111)의 사진을 가져올 때 쓰는 공유 키. 두 서버가 같은 값.
  internal:
    key: ${APP_INTERNAL_KEY:}
    public-api-url: ${APP_PUBLIC_API_URL:}

logging:
  level:
    kr.kiwan.smarthome: INFO
