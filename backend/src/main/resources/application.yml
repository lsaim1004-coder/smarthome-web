spring:
  application:
    name: smarthome-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/smarthome}
    username: ${SPRING_DATASOURCE_USERNAME:smarthome}
    password: ${SPRING_DATASOURCE_PASSWORD:smarthome}
    hikari:
      maximum-pool-size: 5
      initialization-fail-timeout: 60000
  sql:
    init:
      mode: always
      continue-on-error: false
  session:
    jdbc:
      initialize-schema: always
    timeout: 7d
  jackson:
    time-zone: Asia/Seoul
  servlet:
    multipart:
      # 사진 1장 10MB · 한 번에 12장까지. nginx client_max_body_size 와 같이 움직여야 한다.
      max-file-size: 10MB
      max-request-size: 128MB

server:
  port: 8080
  shutdown: graceful
  forward-headers-strategy: framework
  servlet:
    session:
      cookie:
        name: SHSESSION
        http-only: true
        same-site: lax
        secure: false
        path: /

app:
  service-name: Smart Home Option Service
  welcome-message: "입주하는 날, 스마트홈이 완성되어 있습니다."
  base-url: ${APP_BASE_URL:http://localhost}
  # 상담 신청에 붙는 가전 사진 저장 위치. compose 에서 이름 있는 볼륨으로 마운트한다.
  upload-dir: ${APP_UPLOAD_DIR:/data/uploads}
  # 관리자 이메일(콤마 구분). 이 계정으로 로그인하면 /admin/inquiries 목록을 볼 수 있고 상담 접수 알림을 받는다.
  admin-emails: ${APP_ADMIN_EMAILS:}
  mail:
    # log  : 메일을 보내지 않고 백엔드 로그와 API 응답(devCode)에 인증번호 표시 (개발용)
    # smtp : 아래 SMTP 설정으로 실제 발송
    mode: ${APP_MAIL_MODE:log}
    host: ${APP_MAIL_HOST:}
    port: ${APP_MAIL_PORT:587}
    username: ${APP_MAIL_USERNAME:}
    password: ${APP_MAIL_PASSWORD:}
    from: ${APP_MAIL_FROM:no-reply@kiwan.kr}
    starttls: ${APP_MAIL_STARTTLS:true}
  verification:
    code-ttl-minutes: 10
    max-attempts: 5
    resend-cooldown-seconds: 60

logging:
  level:
    kr.kiwan.smarthome: INFO
