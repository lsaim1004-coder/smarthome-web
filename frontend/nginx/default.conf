# 상담 신청은 비로그인 공개 엔드포인트라 더 촘촘하게 제한한다
limit_req_zone $binary_remote_addr zone=inquiry:10m rate=5r/m;

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    absolute_redirect off;   # TLS 종단(Cloudflare·NPM) 뒤에 있어 Location 을 상대 경로로 (http:// 로 굳지 않게)

    # Cloudflare → NPM(192.168.0.x) → 여기. NPM 이 넘겨주는 CF-Connecting-IP 를 실제 클라이언트 IP 로 사용
    set_real_ip_from 192.168.0.0/24;
    set_real_ip_from 172.16.0.0/12;
    real_ip_header CF-Connecting-IP;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
    gzip_min_length 512;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Docker embedded DNS so nginx keeps working when the backend container is recreated
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend http://backend:8080;

    # 가전 사진 첨부: 본문이 커서 별도 location.
    # 정규식 location 은 prefix location 보다 먼저 매칭되므로 아래 /api/inquiries 보다 위에 둔다.
    location ~ ^/api/inquiries/[0-9]+/photos$ {
        limit_req zone=inquiry burst=6 nodelay;
        limit_req_status 429;
        client_max_body_size 128m;
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_request_buffering off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # 상담 신청: IP 당 분당 5회 (burst 3)
    location /api/inquiries {
        limit_req zone=inquiry burst=3 nodelay;
        limit_req_status 429;
        client_max_body_size 16k;
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 30s;
    }

    location /api/ {
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 30s;
    }

    location ~* \.(js|css|svg|png|jpg|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
