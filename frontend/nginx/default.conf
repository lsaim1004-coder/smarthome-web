# /api/auth/ 요청 제한용 (실제 클라이언트 IP 기준). conf.d 는 http 블록 안에 포함되므로 여기 선언 가능
limit_req_zone $binary_remote_addr zone=auth:10m rate=12r/m;

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    # Cloudflare → NPM(192.168.0.x) → 여기. NPM 이 넘겨주는 CF-Connecting-IP 를 실제 클라이언트 IP 로 사용
    set_real_ip_from 192.168.0.0/24;
    set_real_ip_from 172.16.0.0/12;
    real_ip_header CF-Connecting-IP;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
    gzip_min_length 512;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Docker embedded DNS so nginx keeps working when the backend container is recreated
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend http://backend:8080;

    # 상태 조회·로그아웃은 페이지마다 호출되므로 제한 대상에서 제외
    location = /api/auth/me {
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }
    location = /api/auth/logout {
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    # 가입·인증·재발송·로그인은 IP 당 분당 12회 (burst 12)
    location /api/auth/ {
        limit_req zone=auth burst=12 nodelay;
        limit_req_status 429;
        client_max_body_size 16k;
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 30s;
    }

    location /api/ {
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 30s;
    }

    location ~* \.(js|css|svg|png|jpg|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
